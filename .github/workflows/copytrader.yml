name: copytrader

on:
  schedule:
    - cron: "0 6 * * *"      # tracker diario 06:00 UTC
    - cron: "*/30 * * * *"   # copier de respaldo (el principal es la Edge Function con webhook)
    - cron: "45 23 * * *"    # auditor diario 23:45 UTC
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [tracker, copier, auditor, init-db]

permissions:
  contents: write   # el auditor sube su informe a reports/

concurrency:
  group: copytrader-${{ github.event.schedule || inputs.command }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}  # opcional
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Elegir comando
        id: cmd
        run: |
          case "${{ github.event.schedule }}" in
            "0 6 * * *")    echo "name=tracker" >> "$GITHUB_OUTPUT" ;;
            "*/30 * * * *") echo "name=copier"  >> "$GITHUB_OUTPUT" ;;
            "45 23 * * *")  echo "name=auditor" >> "$GITHUB_OUTPUT" ;;
            *)              echo "name=${{ inputs.command }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: python -m copytrader ${{ steps.cmd.outputs.name }}
      - name: Publicar informe de auditoría
        if: steps.cmd.outputs.name == 'auditor'
        run: |
          cat reports/audit-*.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "copytrader-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Auditoría $(date -u +%F)" || exit 0
          git pull --rebase -q && git push -q
